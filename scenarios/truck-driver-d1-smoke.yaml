# D1 验收场景：1 个司机 × 1 天。
# 存在的唯一理由是"最小可运行的接线验证" —— 不要用它下任何结论。
# 项目一的教训：1 天基准的罚分信噪比只有 2.6%（30 天基准是 67.2%）。
name: truck-driver-d1-smoke
variant: full
adapter_name: truck
prompt_version: v1

# 模型侧（会进 run_id）
model_name: qwen3.7-max
model_api_url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
temperature: 0.0

# 场景侧（会进 run_id）
# 环境侧（simkit DriverStateManager）一次只能有一个"当前司机"，所以 D1 只放 1 个。
# 要跑多司机，见 scenarios/truck-driver-monthly-v1.yaml 的说明：并发度必须保持 1，串行跑。
driver_ids: [D001]
duration_days: 1
max_steps: 60

# 预算侧（会进 run_id）
# 注意这两个数是**本地开发值**，不是赛题上限。
# 赛题上限是「每司机 500 万 token / 总仿真 4 小时」——本地跑一次 1 天不该烧掉那个量级。
max_tokens_per_driver: 500000
max_wall_time_minutes: 20

# 运行侧（不进 run_id）
# ★ concurrency 必须为 1，两个硬原因见 adapters/truck.py 的 MAX_SUPPORTED_CONCURRENCY：
#   1) DriverStateManager 只有一个全局 progress 和一个 current_driver_id
#   2) CargoRepository 把 210 MB 全量解析进内存，一份就按 GB 算
concurrency: 1
rpm: 600
tpm: 2000000
token_profile: no_history
enforce_limits: true
