# 场景定义 · Layer 0
# 任何阈值都写在这里，不许硬编码进函数体。
# 硬编码的阈值 = 无法消融 = 无法回答"这个数字是怎么来的"。
name: truck-driver-monthly-v1
variant: baseline
adapter_name: truck        # D2 之前改成 dummy 才能跑起来
prompt_version: v0

# 模型侧（会进 run_id）
model_name: qwen3-max
model_api_url: ""
temperature: 0.0

# 场景侧（会进 run_id）
driver_ids: [d001, d002, d003, d004, d005]
duration_days: 30
max_steps: 400

# 预算侧（会进 run_id）—— 三维熔断，缺一维就不叫熔断
# 下面两个上限取自赛题官方文档，不是自己拍的（出处：docs/01-赛题详情.md「资源与公平性约束」）
#   原文：「复赛阶段限制为：总仿真运行时长不超过 4 小时，且每个司机 Token 消耗不超过 500 万」
# 本地开发请用 CLI 覆盖调低，否则一次评测就能烧掉几个月的额度。
max_tokens_per_driver: 5000000   # 赛题硬上限：每司机 5,000,000 token
max_wall_time_minutes: 240       # 赛题硬上限：总仿真 ≤ 4 小时

# 数据边界（赛题《数据说明》§1.1 明令，不是建议）：
#   禁止决策代码直接读取 cargo_dataset.jsonl / drivers.json（含写死路径、open 整表扫描、按行缓存全库）；
#   观测只能来自环境接口：query_cargo / get_driver_status / query_decision_history。
# 本仓库不含任何赛题数据；scenarios/ 下的示例数据是合成的。

# 运行侧（不进 run_id）
concurrency: 4
rpm: 600
tpm: 2000000
token_profile: no_history
enforce_limits: true
